plugins {
    id 'com.android.application'
}

android {
    namespace 'com.syncclipboard.systemhook'
    compileSdk 31

    defaultConfig {
        applicationId 'com.syncclipboard.systemhook'
        minSdk 26
        targetSdk 31
        versionCode 1
        versionName '0.1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    compileOnly 'de.robv.android.xposed:api:82'
}
