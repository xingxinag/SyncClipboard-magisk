plugins {
    id 'com.android.application'
}

android {
    compileSdk 31
    
    defaultConfig {
        applicationId "com.syncclipboard.helper"
        minSdk 21
        targetSdk 31
        versionCode 250
        versionName "2.5.0"
    }
    
    buildTypes {
        release {
            minifyEnabled false
            // 不签名，使用 unsigned APK（Magisk 安装时会处理）
        }
    }
    
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
